const uid=()=> 'p'+Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function discover(){let cards=[...demos,...data.projects.map(p=>({...p,sub:'YOUR PROTOTYPE',desc:p.pitch,theme:'自作',color:'#e4dfd0',ink:'#625a45',motif:'✧',minutes:3}))].filter(g=>(filter==='すべて'||g.theme===filter)&&(!search||g.title.includes(search)||g.desc.includes(search)));$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">THE NEXT GREAT GAME STARTS HERE</div><h1>遊びから、<br>次の名作を。</h1><p>つくる。遊ぶ。磨きあげる。<br>まだ箱に入っていない、おもしろさに出会おう。</p><button class="light" onclick="document.getElementById('games').scrollIntoView({behavior:'smooth'})">まずは遊んでみる ↗</button></div><div class="art" aria-hidden="true"><div class="board">${'<div class="tile"></div>'.repeat(16)}</div><div class="cardart">♧</div><div class="dice">⚄</div></div></section><div class="flow"><div><small>01 / CREATE</small>アイデアを形に</div><div><small>02 / PLAYTEST</small>遊んで、磨く</div><div><small>03 / GROW</small>ファンを集める</div><div><small>04 / PUBLISH</small>テーブルへ届ける ↗</div></div><div class="sectionhead" id="games"><h2>次は、どれで遊ぶ？</h2><span class="muted small">${cards.length}作品 · サンプル＋この端末の自作</span></div><div class="chips">${['すべて','読み合い','運試し','戦略','自作'].map(f=>`<button class="${filter===f?'selected':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><input aria-label="ゲームを検索" placeholder="タイトル・紹介文で探す" value="${esc(search)}" oninput="search=this.value;const pos=this.selectionStart;discover();const input=document.querySelector('[aria-label=ゲームを検索]');input.focus();input.setSelectionRange(pos,pos)" style="margin-bottom:22px"><div class="grid">${cards.map(g=>`<article class="gamecard"><div class="cover" style="background:${g.color};color:${g.ink}"><span class="stamp">${g.id.startsWith('sample')?'公式サンプル':'自作プロトタイプ'}</span><span class="motif">${g.motif}</span><span class="serial">${g.sub}</span></div><div class="gamebody"><span class="eyebrow muted">${g.theme}</span><h3>${esc(g.title)}</h3><p>${esc(g.desc)}</p><div class="meta">1人 vs コンピューター · 約${g.minutes}分 · ブラウザですぐ試遊</div><button onclick="star function allGames(){return [...demos,...data.projects]}
function quickPlay(){const a=allGames();start(a[Math.floor(Math.random()*a.length)].id)}
render=function(){const dev=['developer','studio','branch','launch'].includes(page);const tabs=[['discover','◈','ゲームを探す'],['library','♡','マイライブラリ'],['insights','✧','自分のレビュー']];if(dev)tabs.push(['developer','⑂','開発者ワークスペース']);$('#nav').innerHTML=tabs.map(([id,i,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${i}</span>${t}</button>`).join('');const pages={discover,studio,insights,launch,play:playUI,library,detail,developer,branch:branchUI};(pages[page]||discover)()};
discover=function(){oldDiscover();$('.hero .eyebrow').textContent='ONE BoardHub. ENDLESS POSSIBILITIES.';$('.hero h1').innerHTML='あと一回、が<br>止まらない。';$('.hero p').innerHTML='気になるゲームを見つけて、すぐに一局。<br>あなたの「おもしろい」が、次の名作を育てる。';$('.hero button').textContent='ゲームを見つける ↗';$('.flow').remove();$('#games').style.marginTop='32px';document.querySelectorAll('.gamebody').forEach((body,i)=>{const title=body.querySelector('h3').textContent;const g=allGames().find(g=>g.title===title);if(!g)return;const actions=document.createElement('div');actions.className='row';actions.innerHTML=`<button class="primary" onclick="start('${g.id}')">▶ 遊ぶ</button><button onclick="openDetail('${g.id}')">詳細・レビュー</button>`;body.querySelector('button').replaceWith(actions)});$('.footer').innerHTML='試作品：現在はコンピューター対戦。この端末の自作・記録を表示しています。対人オンライン対戦・作品共有は次段階で接続します。'};
function openDetail(id){detailId=id;go('detail')}
function favorite(id){data.favorites=data.favorites||[];data.favorites=data.favorites.includes(id)?data.favorites.filter(x=>x!==id):[...data.favorites,id];save();render()}
function library(){let ids=[...new Set(data.sessions.filter(x=>!x.branch).map(x=>x.game))];let fav=data.favorites||[];$('#app').innerHTML=`<div class="eyebrow muted">YOUR BoardHub</div><h1 style="font-size:38px;margin-top:15px">また、遊ぼう。</h1><h3>お気に入り</h3>${gameList(allGames().filter(x=>fav.includes(x.id)),'気になった作品を、詳細ページから保存しよう。')}<h3 style="margin-top:32px">最近遊んだゲーム</h3>${gameList(allGames().filter(x=>ids.includes(x.id)),'まだプレイ履歴がありません。')}<p class="footer">このブラウザでのプレイとお気に入りです。</p>`}
function gameList(games,empty){return games.length?games.map(g=>`<div class="listitem"><div><strong>${esc(g.title)}</strong><div class="muted small" style="margin-top:7px">${esc(g.pitch||g.desc)}</div></div><button onclick="openDetail('${g.id}')">ゲームを見る ↗</button></div>`).join(''):`<div class="empty muted">${empty}</div>`}
function detail(){let p=allGames().find(x=>x.id===detailId);if(!p){go('discover');return}let f=data.feedback.filter(x=>x.game===p.id&&!x.branch);$('#app').innerHTML=`<button onclick="go('discover')">← ゲーム一覧</button><div class="split" style="margin-top:25px"><div><div class="cover" style="height:260px;border-radius:8px;background:${p.color||'#dce6cf'};color:${p.ink||'#426047'}"><span class="motif">${p.motif||'✧'}</span></div><h1 style="font-size:35px;margin:24px 0 12px">${esc(p.title)}</h1><p class="muted">${esc(p.pitch||p.desc)}</p><div class="row"><button class="primary" onclick="start('${p.id}')">▶ 今すぐ遊ぶ</button><button onclick="favorite('${p.id}')">${(data.favorites||[]).includes(p.id)?'♥ 保存済み':'♡ お気に入り'}</button></div><div class="panel" style="margin-top:22px"><h3>遊び方</h3><a class="button" href="/learn?game=${game.p.type}" style="display:inline-block;margin-bottom:15px">動くチュートリアル ↗</a><p class="small">${rules(p.type).replaceAll('21',String(p.config?.target||21)).replace('30点',String(p.config?.target||30)+'点').replace('ラウンド数と同じ点',p.config?.flat?'1点':'ラウンド数と同じ点')}</p><span class="tag">公開版 v${p.version||1}</span> <span class="muted small">コンピューター対戦</span></div></div><div><div class="panel"><h3>プレイヤーレビュー</h3><p class="small muted">この端末で記録した自分のレビュー ${f.length}件</p>${f.length?f.slice().reverse().map(x=>`<div class="check"><span class="tag">${x.rating}/5 · v${x.version||1}</span><p style="margin:10px 0 0;white-space:pre-wrap">${esc(x.note||'コメントなし')}</p></div>`).join(''):'<div class="empty">一局遊んで、最初の感想を残そう。</div>'}</div><details class="devtools"><summary>このゲームの開発に参加する</summary><p class="small muted" style="margin-top:14px">サンプルは自由に複製できます。他の作者の作品をフォークする機能は、公開許諾とライセンスを設定できるようにしてから開放します。</p>${p.id.startsWith('sample')?`<button onclick="forkSample('${p.id}')">複製して自分の版をつくる</button>`:`<button onclick="editing='${p.id}';go('branch')">開発ワークスペースへ ↗</button>`}</details></div></div>`}
function developer(){$('#app').innerHTML=`<div class="eyebrow muted">CREATOR WORKSPACE</div><div class="sectionhead"><h1 style="font-size:38px;margin:14px 0">おもしろさを、分岐させる。</h1><button class="primary" onclick="editNew()">＋ 新規ゲーム</button></div><p class="muted">公開版はそのまま。別のルールを試し、良かった変更を取り込もう。</p><div class="notice">誰でも開発を始められます。プレイヤーの画面には公開版だけを表示し、実験中の変更はブランチ内で試します。</div><div class="panel"><h3>あなたのプロジェクト</h3>${data.projects.length?data.projects.map(p=>`<div class="listitem"><div><strong>${esc(p.title)}</strong><p class="small muted" style="margin:7px 0">公開版 v${p.version} · ${(p.branches||[]).filter(b=>b.status==='draft').length} 試作ブランチ</p></div><button onclick="editing='${p.id}';branchId=null;go('branch')">開く ↗</button></div>`).join(''):'<div class="empty">好きなサンプルを複製して、最初の変更を試そう。</div>'}</div><h3 style="margin-top:30px">サンプルから始める</h3>${demos.map(d=>`<div class="listitem"><strong>${d.title}</strong><button onclick="forkSample('${d.id}')">複製して開発</button></div>`).join('')}<details style="margin-top:25px"><summary>従来のルールメモ編集・データ入出力</summary><button style="margin-top:15px" onclick="editing=null;go('studio')">エディターを開く</button></details>`}
function forkSample(id){let src=demos.find(x=>x.id===id);let p={id:uid(),title:src.title+' / マイバージョン',pitch:src.desc,type:src.type,rules:rules(src.type),version:1,stage:'試遊・改良',config:{target:src.type==='dice'?30:21,flat:false},branches:[],history:[],forkOf:id};data.projects.push(p);save();editing=p.id;branchId=null;go('branch');toast('サンプルを複製しました')}
function currentProject(){return data.projects.find(x=>x.id===editing)}
function configText(p,c){return p.type==='auction'?(c?.flat?'各ラウンド1点':'後のラウンドほど高得点'):p.type==='dice'?`先に${c?.target||30}点で勝利`:`${c?.target||21}ちょうどで勝利`}
function branchUI(){let p=currentProject();if(!p){go('developer');return}p.branches=p.branches||[];let b=p.branches.find(x=>x.id===branchId);$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow muted">DEVELOPER / ${esc(p.title)}</div><h2 style="margin-top:12px">公開版から、次の一手を。</h2></div><button onclick="go('developer')">プロジェクト一覧</button></div><div class="split"><div><div class="panel"><div class="sectionhead"><span class="tag">● main · 公開版 v${p.version}</span><button onclick="start('${p.id}')">公開版で遊ぶ</button></div><p class="small">${configText(p,p.config)}</p><div class="row"><button class="primary" onclick="createBranch()">⑂ ブランチをつくる</button><button onclick="go('launch')">製品化の計画 ↗</button></div></div><div class="branchline">${p.branches.length?p.branches.slice().reverse().map(x=>`<article><div class="row"><div><strong>${esc(x.name)}</strong><p class="muted small" style="margin:7px 0">v${x.baseVersion}から分岐 · ${x.status==='merged'?'反映済み':'実験中'}</p></div><button onclick="branchId='${x.id}';branchUI()">${x.id===branchId?'選択中':'変更を見る'}</button></div></article>`).join(''):'<article><p class="muted small">まだブランチはありません。<br>短時間版や初心者向け版を、安全に試せます。</p></article>'}</div><details class="panel"><summary>公開版の履歴 ${(p.history||[]).length}件</summary>${(p.history||[]).slice().reverse().map(h=>`<div class="check"><span class="version">v${h.version}</span> — ${configText(p,h.config)} <button onclick="restoreBranch('${h.id}')">この版から再試作</button></div>`).join('')||'<p class="small muted" style="margin-top:14px">変更を反映すると、直前の公開版をここに残します。</p>'}</details></div><div class="panel">${b?branchEditor(p,b):`<div class="eyebrow muted">LANGUAGE → BRANCH → PLAY → MERGE</div><h3 style="margin-top:20px">「もう少し短くしたい」から始めよう。</h3><p class="muted small">ブランチごとに変更指示、ルール差分、試遊記録を残します。プレイヤーが遊ぶ公開版は、反映するまで変わりません。</p><div class="notice">AIによる自由な変更生成は未接続です。初版では指示メモ＋対応するパラメーター変更で、分岐・比較・反映の流れを体験できます。</div>`}</div></div>`;if(b&&b.status==='draft'){const f=$('#branchform');f.onsubmit=e=>{e.preventDefault();let fd=new FormData(f);b.instruction=String(fd.get('instruction'));b.config=p.type==='auction'?{...b.config,flat:fd.get('flat')==='yes'}:{...b.config,target:Number(fd.get('target'))};b.updated=new Date().toISOString();save();branchUI();toast('ブランチに変更を保存しました。公開版はそのままです。')}}}
function branchEditor(p,b){let counts=data.sessions.filter(x=>x.game===p.id&&x.branch===b.id).length;return `<div class="eyebrow muted">⑂ ${esc(b.name)}</div><h3 style="margin-top:16px">変更を試して、確かめる。</h3><form id="branchform"><label>AIへの変更指示（保存のみ・AI未接続）</label><textarea name="instruction" ${b.status==='merged'?'disabled':''} placeholder="例：決着が早くなるよう、勝利条件を20点に変えて。">${esc(b.instruction||'')}</textarea><p class="small muted">AI未接続：この文章を送信しても、自動生成や外部APIの呼び出しは行いません。下の値が実際の試遊ルールです。</p>${p.type==='auction'?`<label>得点の配分</label><select name="flat" ${b.status==='merged'?'disabled':''}><option value="no" ${!b.config?.flat?'selected':''}>ラウンドごとに1→5点</option><option value="yes" ${b.config?.flat?'selected':''}>毎ラウンド1点</option></select>`:`<label>勝利条件の数字（10〜60）</label><input type="number" name="target" required min="10" max="60" value="${b.config?.target||(p.type==='dice'?30:21)}" ${b.status==='merged'?'disabled':''}>`}<div class="diff"><div><small>main · v${p.version}</small><p style="margin:12px 0 0">${configText(p,p.config)}</p></div><div><small>${esc(b.name)}</small><p style="margin:12px 0 0">${configText(p,b.config)}</p></div></div>${b.status==='draft'?'<button type="submit">変更をブランチに保存</button>':''}</form><div class="row" style="margin-top:15px"><button onclick="tryBranch('${b.id}')">▶ この版で試遊</button>${b.status==='draft'?`<button class="primary" onclick="mergeBranch('${b.id}')">公開版に反映</button>`:''}</div><p class="small muted" style="margin-top:16px">このブランチの試遊：${counts}回（この端末のみ）</p>${b.status==='draft'&&b.baseVersion!==p.version?'<div class="notice">分岐元から公開版が更新されています。そのまま上書きせず、新しい公開版からブランチを作り直してください。</div>':''}`}
function createBranch(){let p=currentProject();let n=p.branches.length+1;let b={id:uid(),name:'experiment-'+n,baseVersion:p.version,config:structuredClone(p.config||{target:p.type==='dice'?30:21,flat:false}),instruction:'',status:'draft',created:new Date().toISOString()};p.branches.push(b);branchId=b.id;save();branchUI()}
function tryBranch(id){let p=currentProject(),b=p.branches.find(x=>x.id===id);start(p.id);game.p={...p,config:structuredClone(b.config),branch:b.id};playUI()}
function mergeBranch(id){let p=currentProject(),b=p.branches.find(x=>x.id===id);if(b.status!=='draft')return;if(b.baseVersion!==p.version){toast('公開版が更新されています。最新の公開版から分岐してください');return}$('#modal').innerHTML=`<div class="modal"><div class="modalbox"><h2>この変更を公開版に反映する？</h2><p>v${p.version} → v${p.version+1}</p><div class="diff"><div>${configText(p,p.config)}</div><div>${configText(p,b.config)}</div></div><p class="small muted">この端末で「遊ぶ」を押した時のルールが変わります。直前の公開版は履歴に保存します。</p><div class="row"><button onclick="closeModal()">戻る</button><button class="primary" onclick="commitMerge('${b.id}')">反映する</button></div></div></div>`}
function commitMerge(id){let p=currentProject(),b=p.branches.find(x=>x.id===id);if(b.status!=='draft'||b.baseVersion!==p.version){closeModal();toast('公開版が更新されました');return}p.history=p.history||[];p.history.push({id:uid(),version:p.version,config:structuredClone(p.config||{}),at:new Date().toISOString()});p.config=structuredClone(b.config);p.version++;b.status='merged';b.mergedVersion=p.version;save();closeModal();branchUI();toast('v'+p.version+'を公開版に反映しました')}
function restoreBranch(id){let p=currentProject(),h=p.history.find(x=>x.id===id);createBranch();let b=p.branches.find(x=>x.id===branchId);b.config=structuredClone(h.config);b.instruction='v'+h.version+'のルールを再検証する';save();branchUI()}
studio=function(){oldStudio();const n=document.createElement('div');n.className='notice';n.innerHTML='ここはルールメモの編集画面です。公開版と試作を分ける場合は <button onclick="go(\'developer\')">開発者ワークスペース</button> を使ってください。';$('#app').prepend(n)};
render();

const requestedGame=new URLSearchParams(location.search).get('game');if(requestedGame){const selectedDemo=demos.find(x=>x.type===requestedGame);if(selectedDemo){document.body.classList.add('play-entry');document.querySelector('.topbar').innerHTML='<a href="/" style="text-decoration:none;color:#0071e3">‹ ゲーム一覧</a><span>'+esc(selectedDemo.title)+'</span><a href="/learn?game='+selectedDemo.type+'" style="color:#0071e3">遊び方</a>';if(new URLSearchParams(location.search).get('resume')==='1'){try{const saved=JSON.parse(localStorage.getItem('boardhub-resume-v1')||'[]').find(x=>x.id===requestedGame)?.state;if(saved&&!saved.ended){game=saved;page='play';render()}else start(selectedDemo.id)}catch{start(selectedDemo.id)}}else start(selectedDemo.id)}}
</script></body></html>
